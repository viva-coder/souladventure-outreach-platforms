<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoulAdventure · Outreach Universe</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

<style>
body {
  margin:0;
  background:#0a0d0f;
  color:#c8d4cc;
  font-family: monospace;
}
#graph { width:100vw; height:100vh; }

#filters {
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
}

.pill {
  padding:6px 12px;
  border:1px solid #333;
  cursor:pointer;
}

.pill.active {
  background:#c9a96e;
  color:black;
}

#add {
  position:fixed;
  bottom:20px;
  right:20px;
  padding:10px;
}
</style>
</head>

<body>

<div id="filters">
  <div class="pill active" data-cat="all">All</div>
  <div class="pill" data-cat="02_platforms">Platforms</div>
  <div class="pill" data-cat="general_and_niche">General</div>
  <div class="pill" data-cat="NSW">NSW</div>
  <div class="pill" data-cat="QLD">QLD</div>
  <div class="pill" data-cat="VIC">VIC</div>
  <div class="pill" data-cat="other_states">Other</div>
</div>

<button id="add">+ Add</button>

<svg id="graph"></svg>

<script>
const COLOR = {
  center:'#c9a96e',
  '02_platforms':'#4db89e',
  'general_and_niche':'#7db87a',
  'NSW':'#d4748a',
  'QLD':'#d4a04a',
  'VIC':'#9b7fd4',
  'other_states':'#5aaccf'
};

let nodesData = [];
let activeFilter = 'all';

/* -------- NORMALIZE -------- */
function normalize(cat){
  const c = String(cat || '').toLowerCase();

  if(c.includes('platform')) return '02_platforms';
  if(c.includes('general')) return 'general_and_niche';
  if(c.includes('nsw')) return 'NSW';
  if(c.includes('qld')) return 'QLD';
  if(c.includes('vic')) return 'VIC';
  return 'other_states';
}

/* -------- LOAD -------- */
async function load(){
  const res = await fetch('/api/nodes');
  const data = await res.json();

  nodesData = data.map(n => ({
    ...n,
    id: String(n.id),
    category: normalize(n.category)
  }));

  draw();
}

/* -------- DRAW -------- */
function draw(){
  const svg = d3.select("#graph");
  svg.selectAll("*").remove();

  const width = window.innerWidth;
  const height = window.innerHeight;

  const center = { id:'center', name:'SoulAdventure', category:'center' };

  const filtered = nodesData.filter(n =>
    activeFilter === 'all' || n.category === activeFilter
  );

  const nodes = [center, ...filtered];
  const links = filtered.map(n => ({ source:'center', target:n.id }));

  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d=>d.id).distance(150))
    .force("charge", d3.forceManyBody().strength(-200))
    .force("center", d3.forceCenter(width/2, height/2));

  const link = svg.append("g")
    .selectAll("line")
    .data(links)
    .join("line")
    .attr("stroke","#333");

  const node = svg.append("g")
    .selectAll("circle")
    .data(nodes)
    .join("circle")
    .attr("r", d=> d.id==='center'?20:8)
    .attr("fill", d=> COLOR[d.category] || "#999")
    .call(d3.drag()
      .on("drag", (e,d)=>{
        d.fx = e.x;
        d.fy = e.y;
      })
    );

  const text = svg.append("g")
    .selectAll("text")
    .data(nodes)
    .join("text")
    .text(d=>d.name)
    .attr("font-size","10px")
    .attr("fill","#ccc");

  sim.on("tick", ()=>{
    link
      .attr("x1",d=>d.source.x)
      .attr("y1",d=>d.source.y)
      .attr("x2",d=>d.target.x)
      .attr("y2",d=>d.target.y);

    node
      .attr("cx",d=>d.x)
      .attr("cy",d=>d.y);

    text
      .attr("x",d=>d.x)
      .attr("y",d=>d.y+15);
  });
}

/* -------- FILTER UI -------- */
document.querySelectorAll('.pill').forEach(p=>{
  p.onclick = ()=>{
    document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
    activeFilter = p.dataset.cat;
    draw();
  };
});

/* -------- ADD NODE -------- */
document.getElementById('add').onclick = async ()=>{
  const name = prompt("Name?");
  const category = prompt("Category (NSW, QLD, VIC, platform, general)?");

  await fetch('/api/nodes', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, category })
  });

  load();
};

load();
</script>

</body>
</html>
