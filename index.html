<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SoulAdventure · Outreach Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg: #0a0d0f;
    --bg2: #111518;
    --bg3: #181e22;
    --border: #1e2830;
    --text: #c8d4cc;
    --text-dim: #566860;
    --text-bright: #e8f0ea;
    --gold: #c9a96e;
    --gold-dim: #7a6040;
    --teal: #4db89e;
    --rose: #d4748a;
    --amber: #d4a04a;
    --lavender: #9b7fd4;
    --sky: #5aaccf;
    --lime: #7db87a;
    --panel: 380px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; }

  /* HEADER */
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; gap: 20px;
    padding: 14px 24px;
    background: linear-gradient(to bottom, rgba(10,13,15,0.98), rgba(10,13,15,0));
    pointer-events: none;
  }
  #header .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 300; letter-spacing: 0.12em;
    color: var(--gold); pointer-events: auto;
  }
  #header .logo span { font-style: italic; color: var(--text-bright); }
  #header .subtitle {
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--text-dim); padding-top: 2px;
  }
  #header .spacer { flex: 1; }
  #stats {
    display: flex; gap: 24px; pointer-events: auto;
  }
  .stat { text-align: right; }
  .stat-val { font-size: 20px; color: var(--gold); font-weight: 300; }
  .stat-label { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); }

  /* CANVAS */
  #graph-container {
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at 30% 40%, #0d1a14 0%, #0a0d0f 60%);
  }
  svg { width: 100%; height: 100%; }

  /* SEARCH BAR */
  #search-bar {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    z-index: 100;
    display: flex; align-items: center; gap: 0;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 2px; overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    width: 440px;
  }
  #search-icon { padding: 10px 12px; color: var(--text-dim); font-size: 14px; }
  #search-input {
    flex: 1; background: none; border: none; outline: none;
    font-family: 'DM Mono', monospace; font-size: 12px;
    color: var(--text-bright); padding: 10px 0;
    letter-spacing: 0.05em;
  }
  #search-input::placeholder { color: var(--text-dim); }
  #search-clear {
    padding: 10px 14px; cursor: pointer; color: var(--text-dim);
    font-size: 16px; line-height: 1;
    transition: color 0.2s;
  }
  #search-clear:hover { color: var(--gold); }

  /* FILTER PILLS */
  #filters {
    position: fixed; top: 118px; left: 50%; transform: translateX(-50%);
    z-index: 100;
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
  }
  .pill {
    padding: 4px 12px; border-radius: 2px;
    font-family: 'DM Mono', monospace; font-size: 9px;
    letter-spacing: 0.15em; text-transform: uppercase;
    cursor: pointer; border: 1px solid transparent;
    transition: all 0.2s; user-select: none;
  }
  .pill.active, .pill:hover { border-color: currentColor; }
  .pill[data-cat="all"] { color: var(--gold); }
  .pill[data-cat="platform"] { color: var(--teal); }
  .pill[data-cat="fb_general"] { color: var(--lime); }
  .pill[data-cat="fb_nsw"] { color: var(--rose); }
  .pill[data-cat="fb_qld"] { color: var(--amber); }
  .pill[data-cat="fb_vic"] { color: var(--lavender); }
  .pill[data-cat="fb_other"] { color: var(--sky); }

  /* LEGEND */
  #legend {
    position: fixed; bottom: 24px; left: 24px; z-index: 100;
    display: flex; flex-direction: column; gap: 6px;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* SIDE PANEL */
  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: var(--panel);
    background: var(--bg2); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
    z-index: 200; display: flex; flex-direction: column;
    overflow: hidden;
  }
  #panel.open { transform: translateX(0); }
  #panel-header {
    padding: 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  #panel-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 400; color: var(--text-bright);
    line-height: 1.2; flex: 1; padding-right: 12px;
  }
  #panel-close {
    cursor: pointer; color: var(--text-dim); font-size: 20px; line-height: 1;
    transition: color 0.2s; padding: 2px;
  }
  #panel-close:hover { color: var(--gold); }
  #panel-body { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .panel-field label {
    display: block; font-size: 9px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px;
  }
  .panel-field input, .panel-field select, .panel-field textarea {
    width: 100%; background: var(--bg3); border: 1px solid var(--border);
    color: var(--text-bright); font-family: 'DM Mono', monospace;
    font-size: 12px; padding: 10px 12px; border-radius: 2px;
    outline: none; transition: border-color 0.2s; resize: vertical;
  }
  .panel-field input:focus, .panel-field select:focus, .panel-field textarea:focus {
    border-color: var(--gold-dim);
  }
  .panel-field select option { background: var(--bg3); }
  #panel-footer {
    padding: 20px 24px; border-top: 1px solid var(--border);
    display: flex; gap: 10px;
  }
  .btn {
    flex: 1; padding: 11px; border: none; border-radius: 2px;
    font-family: 'DM Mono', monospace; font-size: 11px;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-primary { background: var(--gold); color: #0a0d0f; }
  .btn-primary:hover { background: #e0bc82; }
  .btn-danger { background: transparent; border: 1px solid #6b2a2a; color: #c46060; }
  .btn-danger:hover { background: #6b2a2a; color: #ffaaaa; }
  .btn-link {
    background: transparent; border: 1px solid var(--border); color: var(--teal);
    text-decoration: none; display: flex; align-items: center; justify-content: center;
    flex: none; padding: 11px 16px;
  }
  .btn-link:hover { border-color: var(--teal); background: rgba(77,184,158,0.08); }

  /* ADD NODE BUTTON */
  #add-btn {
    position: fixed; bottom: 24px; right: 24px; z-index: 100;
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--gold); color: #0a0d0f;
    border: none; cursor: pointer; font-size: 22px; line-height: 1;
    box-shadow: 0 4px 20px rgba(201,169,110,0.35);
    transition: all 0.2s; display: flex; align-items: center; justify-content: center;
  }
  #add-btn:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(201,169,110,0.5); }

  /* TOOLTIP */
  #tooltip {
    position: fixed; z-index: 300; pointer-events: none;
    background: var(--bg2); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 2px;
    font-size: 11px; color: var(--text);
    opacity: 0; transition: opacity 0.15s;
    max-width: 220px; white-space: nowrap;
  }

  /* TOAST */
  #toast {
    position: fixed; bottom: 80px; right: 24px; z-index: 400;
    background: var(--bg2); border: 1px solid var(--border);
    padding: 12px 20px; border-radius: 2px;
    font-size: 11px; color: var(--text-bright);
    transform: translateY(20px); opacity: 0;
    transition: all 0.3s; pointer-events: none;
  }
  #toast.show { transform: translateY(0); opacity: 1; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Grid bg lines */
  .grid-line { stroke: #131a1f; stroke-width: 1; }
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div>
    <div class="logo">Soul<span>Adventure</span></div>
    <div class="subtitle">Outreach Universe</div>
  </div>
  <div class="spacer"></div>
  <div id="stats">
    <div class="stat">
      <div class="stat-val" id="stat-nodes">—</div>
      <div class="stat-label">Nodes</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-platforms">—</div>
      <div class="stat-label">Platforms</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-groups">—</div>
      <div class="stat-label">FB Groups</div>
    </div>
  </div>
</div>

<!-- Search -->
<div id="search-bar">
  <div id="search-icon">⌕</div>
  <input id="search-input" type="text" placeholder="Search nodes…" autocomplete="off"/>
  <div id="search-clear">×</div>
</div>

<!-- Filter pills -->
<div id="filters">
  <div class="pill active" data-cat="all">All</div>
  <div class="pill" data-cat="platform">Platforms</div>
  <div class="pill" data-cat="fb_general">General</div>
  <div class="pill" data-cat="fb_nsw">NSW</div>
  <div class="pill" data-cat="fb_qld">QLD</div>
  <div class="pill" data-cat="fb_vic">VIC</div>
  <div class="pill" data-cat="fb_other">Other States</div>
</div>

<!-- Graph -->
<div id="graph-container">
  <svg id="graph"></svg>
</div>

<!-- Legend -->
<div id="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--gold)"></div>SoulAdventure HQ</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--teal)"></div>Platforms</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--lime)"></div>General / Niche</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--rose)"></div>NSW</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--amber)"></div>QLD</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--lavender)"></div>VIC</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--sky)"></div>Other States</div>
</div>

<!-- Side Panel -->
<div id="panel">
  <div id="panel-header">
    <div id="panel-title">Node</div>
    <div id="panel-close">×</div>
  </div>
  <div id="panel-body">
    <input type="hidden" id="field-id"/>
    <div class="panel-field">
      <label>Name</label>
      <input type="text" id="field-name" placeholder="Group or platform name"/>
    </div>
    <div class="panel-field">
      <label>Category</label>
      <select id="field-category">
        <option value="platform">Platform</option>
        <option value="fb_general">FB Group — General</option>
        <option value="fb_nsw">FB Group — NSW</option>
        <option value="fb_qld">FB Group — QLD</option>
        <option value="fb_vic">FB Group — VIC</option>
        <option value="fb_other">FB Group — Other States</option>
      </select>
    </div>
    <div class="panel-field">
      <label>URL / Link</label>
      <input type="url" id="field-url" placeholder="https://…"/>
    </div>
    <div class="panel-field">
      <label>Members</label>
      <input type="text" id="field-members" placeholder="e.g. 4,200"/>
    </div>
    <div class="panel-field">
      <label>Notes</label>
      <textarea id="field-notes" rows="4" placeholder="Status, contact, outreach notes…"></textarea>
    </div>
  </div>
  <div id="panel-footer">
    <button class="btn btn-primary" id="btn-save">Save</button>
    <a class="btn btn-link" id="btn-link" href="#" target="_blank" rel="noopener">↗</a>
    <button class="btn btn-danger" id="btn-delete">Delete</button>
  </div>
</div>

<!-- Add button -->
<button id="add-btn" title="Add new node">+</button>

<!-- Tooltip -->
<div id="tooltip"></div>

<!-- Toast -->
<div id="toast"></div>

<script>
const COLOR = {
  center:     '#c9a96e',
  platform:   '#4db89e',
  fb_general: '#7db87a',
  fb_nsw:     '#d4748a',
  fb_qld:     '#d4a04a',
  fb_vic:     '#9b7fd4',
  fb_other:   '#5aaccf',
};

let allNodes = [];
let simulation, svg, g, linkSel, nodeSel;
let activeFilter = 'all';
let searchTerm = '';
let currentNode = null;

// ─── DATA ────────────────────────────────────────────────
async function loadNodes() {
  const res = await fetch('/api/nodes');
  allNodes = await res.json();
  updateStats();
  buildGraph();
}

function updateStats() {
  document.getElementById('stat-nodes').textContent = allNodes.length + 1;
  document.getElementById('stat-platforms').textContent = allNodes.filter(n => n.category === 'platform').length;
  document.getElementById('stat-groups').textContent = allNodes.filter(n => n.category.startsWith('fb_')).length;
}

function filteredNodes() {
  return allNodes.filter(n => {
    const matchCat = activeFilter === 'all' || n.category === activeFilter;
    const matchSearch = !searchTerm || n.name.toLowerCase().includes(searchTerm.toLowerCase());
    return matchCat && matchSearch;
  });
}

// ─── GRAPH ───────────────────────────────────────────────
function buildGraph() {
  const container = document.getElementById('graph-container');
  const W = container.clientWidth, H = container.clientHeight;

  d3.select('#graph').selectAll('*').remove();
  svg = d3.select('#graph');

  // Zoom
  const zoom = d3.zoom().scaleExtent([0.15, 4])
    .on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);

  g = svg.append('g');

  // Defs — glow filter
  const defs = svg.append('defs');
  const glow = defs.append('filter').attr('id','glow').attr('x','-50%').attr('y','-50%').attr('width','200%').attr('height','200%');
  glow.append('feGaussianBlur').attr('stdDeviation','4').attr('result','blur');
  const feMerge = glow.append('feMerge');
  feMerge.append('feMergeNode').attr('in','blur');
  feMerge.append('feMergeNode').attr('in','SourceGraphic');

  const nodes_data = filteredNodes();
  const center = { id: 'center', name: 'SoulAdventure', category: 'center', x: W/2, y: H/2, fx: W/2, fy: H/2 };
  const all = [center, ...nodes_data.map(n => ({...n, id: String(n.id)}))];
  const links = nodes_data.map(n => ({ source: 'center', target: String(n.id) }));

  simulation = d3.forceSimulation(all)
    .force('link', d3.forceLink(links).id(d => d.id).distance(d => d.source.id === 'center' ? (d.target.category === 'platform' ? 160 : 220) : 80).strength(0.6))
    .force('charge', d3.forceManyBody().strength(-180))
    .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 12))
    .force('x', d3.forceX(W/2).strength(0.04))
    .force('y', d3.forceY(H/2).strength(0.04));

  // Links
  linkSel = g.append('g').selectAll('line')
    .data(links).join('line')
    .attr('stroke', d => {
      const t = all.find(n => n.id === (d.target.id || d.target));
      return t ? COLOR[t.category] || '#333' : '#333';
    })
    .attr('stroke-opacity', 0.18)
    .attr('stroke-width', 1);

  // Nodes
  const nodeG = g.append('g').selectAll('g')
    .data(all).join('g')
    .attr('class','node-g')
    .style('cursor', d => d.id === 'center' ? 'default' : 'pointer')
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end', (e, d) => { if (!e.active) simulation.alphaTarget(0); if (d.id !== 'center') { d.fx = null; d.fy = null; } })
    )
    .on('click', (e, d) => { if (d.id !== 'center') { e.stopPropagation(); openPanel(d); } })
    .on('mouseover', (e, d) => { if (d.id !== 'center') showTooltip(e, d); })
    .on('mousemove', (e) => moveTooltip(e))
    .on('mouseout', hideTooltip);

  // Outer ring for platforms/center
  nodeG.filter(d => d.category === 'center' || d.category === 'platform')
    .append('circle')
    .attr('r', d => nodeRadius(d) + 7)
    .attr('fill', 'none')
    .attr('stroke', d => COLOR[d.category])
    .attr('stroke-opacity', 0.2)
    .attr('stroke-width', 1);

  nodeG.append('circle')
    .attr('r', d => nodeRadius(d))
    .attr('fill', d => COLOR[d.category] || '#555')
    .attr('fill-opacity', d => d.category === 'center' ? 1 : 0.85)
    .attr('filter', d => d.category === 'center' ? 'url(#glow)' : null);

  nodeG.append('text')
    .attr('text-anchor', 'middle')
    .attr('dy', d => nodeRadius(d) + 14)
    .attr('fill', d => COLOR[d.category])
    .attr('font-size', d => d.category === 'center' ? 13 : (d.category === 'platform' ? 10 : 9))
    .attr('font-family', d => d.category === 'center' ? "'Cormorant Garamond', serif" : "'DM Mono', monospace")
    .attr('letter-spacing', '0.05em')
    .text(d => truncate(d.name, d.category === 'center' ? 30 : 22))
    .attr('pointer-events', 'none');

  // Center icon
  nodeG.filter(d => d.category === 'center')
    .append('text')
    .attr('text-anchor','middle').attr('dy','0.35em')
    .attr('fill','#0a0d0f').attr('font-size','18px')
    .text('🌿').attr('pointer-events','none');

  simulation.on('tick', () => {
    linkSel
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeG.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  // Click outside panel
  svg.on('click', closePanel);
}

function nodeRadius(d) {
  if (d.category === 'center') return 30;
  if (d.category === 'platform') return 14;
  return 7;
}

function truncate(str, n) {
  return str.length > n ? str.slice(0, n-1) + '…' : str;
}

// ─── TOOLTIP ─────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
function showTooltip(e, d) {
  tooltip.innerHTML = `<strong>${d.name}</strong>${d.url ? '<br><span style="color:var(--text-dim)">click to open</span>' : ''}`;
  tooltip.style.opacity = 1;
  moveTooltip(e);
}
function moveTooltip(e) {
  tooltip.style.left = (e.clientX + 14) + 'px';
  tooltip.style.top = (e.clientY - 10) + 'px';
}
function hideTooltip() { tooltip.style.opacity = 0; }

// ─── PANEL ───────────────────────────────────────────────
const panel = document.getElementById('panel');
function openPanel(d) {
  currentNode = d;
  document.getElementById('panel-title').textContent = d.name;
  document.getElementById('field-id').value = d.id || '';
  document.getElementById('field-name').value = d.name || '';
  document.getElementById('field-category').value = d.category || 'fb_general';
  document.getElementById('field-url').value = d.url || '';
  document.getElementById('field-members').value = d.members || '';
  document.getElementById('field-notes').value = d.notes || '';
  const link = document.getElementById('btn-link');
  if (d.url) { link.href = d.url; link.style.display = 'flex'; }
  else { link.style.display = 'none'; }
  panel.classList.add('open');
}
function openNewPanel() {
  currentNode = null;
  document.getElementById('panel-title').textContent = 'New Node';
  document.getElementById('field-id').value = '';
  document.getElementById('field-name').value = '';
  document.getElementById('field-category').value = 'fb_general';
  document.getElementById('field-url').value = '';
  document.getElementById('field-members').value = '';
  document.getElementById('field-notes').value = '';
  document.getElementById('btn-link').style.display = 'none';
  panel.classList.add('open');
}
function closePanel() { panel.classList.remove('open'); }
document.getElementById('panel-close').addEventListener('click', closePanel);

// ─── SAVE ─────────────────────────────────────────────────
document.getElementById('btn-save').addEventListener('click', async () => {
  const id = document.getElementById('field-id').value;
  const payload = {
    name: document.getElementById('field-name').value,
    category: document.getElementById('field-category').value,
    url: document.getElementById('field-url').value,
    members: document.getElementById('field-members').value,
    notes: document.getElementById('field-notes').value,
  };
  if (!payload.name) { showToast('Name is required'); return; }
  if (id) {
    const res = await fetch(`/api/nodes/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const updated = await res.json();
    allNodes = allNodes.map(n => n.id == id ? updated : n);
    showToast('Saved ✓');
  } else {
    const res = await fetch('/api/nodes', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const created = await res.json();
    allNodes.push(created);
    showToast('Added ✓');
  }
  closePanel();
  updateStats();
  buildGraph();
});

// ─── DELETE ───────────────────────────────────────────────
document.getElementById('btn-delete').addEventListener('click', async () => {
  const id = document.getElementById('field-id').value;
  if (!id) { closePanel(); return; }
  if (!confirm('Delete this node?')) return;
  await fetch(`/api/nodes/${id}`, { method:'DELETE' });
  allNodes = allNodes.filter(n => n.id != id);
  closePanel();
  updateStats();
  buildGraph();
  showToast('Deleted');
});

// ─── ADD BTN ──────────────────────────────────────────────
document.getElementById('add-btn').addEventListener('click', e => { e.stopPropagation(); openNewPanel(); });

// ─── SEARCH ───────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', e => {
  searchTerm = e.target.value;
  buildGraph();
});
document.getElementById('search-clear').addEventListener('click', () => {
  searchTerm = '';
  document.getElementById('search-input').value = '';
  buildGraph();
});

// ─── FILTERS ──────────────────────────────────────────────
document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    activeFilter = pill.dataset.cat;
    buildGraph();
  });
});

// ─── TOAST ────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ─── RESIZE ───────────────────────────────────────────────
window.addEventListener('resize', () => buildGraph());

// ─── INIT ─────────────────────────────────────────────────
loadNodes();
</script>
</body>
</html>
